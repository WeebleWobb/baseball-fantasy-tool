version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    # Skip releases younger than a week so a PR isn't replaced days later
    # by the next patch of the same package.
    cooldown:
      default-days: 7
    groups:
      # One PR a week for every minor and patch update, production and dev.
      # Majors still arrive as individual PRs.
      minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Security fixes arrive together instead of one PR per package.
      security:
        applies-to: security-updates
        patterns:
          - "*"
    open-pull-requests-limit: 5
    reviewers:
      - "WeebleWobb"
    ignore:
      # ESLint 10 is blocked until eslint-plugin-react supports it.
      # Tracking: https://github.com/jsx-eslint/eslint-plugin-react/issues/3977
      # The eslint-10-watch workflow opens an issue when this can be removed.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns:
          - "*"
